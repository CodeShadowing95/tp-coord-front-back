name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "demo 2"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make mvnw executable
        run: chmod +x ./mvnw
      - name: Run tests
        run: ./mvnw -B test jacoco:report
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "demo 2/target/site/jacoco"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: frontend-angular/coverage/lcov-report

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start backend
        working-directory: "demo 2"
        run: |
          chmod +x ./mvnw
          ./mvnw -B spring-boot:run > ../backend.log 2>&1 &

          for i in {1..60}; do
            code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/ || true)"
            if [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not start in time"
          tail -n 200 ../backend.log || true
          exit 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-angular
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend-angular
          install: false
          start: npm start
          wait-on: http://localhost:4200
          wait-on-timeout: 120
      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend-angular/cypress/screenshots
            frontend-angular/cypress/videos
  build-backend:
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: build
        run: mvn package -DskipTests=true -file pom.xml
      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: "demo 2/target/*.jar"
